name: 🍲 Automaattinen Ruokalistojen Päivitys

on:
  schedule:
    # Run every Monday through Friday at 05:00 UTC (08:00 Finnish local time)
    - cron: '0 5 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-menus:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Kaiva ja päivitä ruokalistat
        run: npm run scrape

      - name: 🚀 Commit and push updated menus
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add server/data/menus_latest.json server/data/menus_week.json
          if git diff --staged --quiet; then
            echo "Ei uusia muutoksia ruokalistoissa."
          else
            git commit -m "chore(data): päivitetty lounaslistat automaattisesti [$(date +'%Y-%m-%d %H:%M')]"
            git push
          fi
